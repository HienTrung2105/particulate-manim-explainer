[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "particulate-video"
version = "0.1.0"
description = "Manim foundation for an explanatory video about PARTICULATE."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "manim==0.20.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

